<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--text-primary:#e8e8e0;--text-secondary:#9c9a92;
  --sidebar-bg:rgba(18,18,20,0.88);--sidebar-border:rgba(255,255,255,0.12);
  --nav-bg:rgba(0,0,0,0.75);--card-bg:rgba(255,255,255,0.07);
}
:root.dark{
  --bg:#000;--text-primary:#e8e8e0;--text-secondary:#9c9a92;
  --sidebar-bg:rgba(18,18,20,0.88);--sidebar-border:rgba(255,255,255,0.12);
  --nav-bg:rgba(0,0,0,0.75);--card-bg:rgba(255,255,255,0.07);
}
body{background:#000;color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
#top-nav{
  position:fixed;top:0;left:0;right:0;height:48px;z-index:100;
  background:var(--nav-bg);border-bottom:1px solid var(--sidebar-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;padding:0 16px;gap:16px;
}
.nav-brand{font-weight:700;font-size:15px;color:var(--text-primary);white-space:nowrap}
.nav-links{display:flex;gap:4px;flex:1}
.nav-link{
  padding:6px 12px;border-radius:6px;text-decoration:none;
  font-size:13px;font-weight:500;color:var(--text-secondary);
  transition:background 0.15s,color 0.15s;
}
.nav-link:hover{background:var(--card-bg);color:var(--text-primary)}
.nav-link.active{background:var(--card-bg);color:var(--text-primary)}
#theme-toggle{
  background:none;border:1px solid var(--border);border-radius:6px;
  padding:2px 6px;cursor:pointer;font-size:18px;line-height:1;
}
#globe-container{
  position:fixed;top:48px;left:0;right:0;bottom:0;
}
#legend{
  position:fixed;bottom:24px;right:24px;z-index:10;
  background:var(--sidebar-bg);border:1px solid var(--sidebar-border);
  border-radius:10px;padding:12px 16px;
  box-shadow:0 2px 12px rgba(0,0,0,0.12);
}
.legend-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-secondary);margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);margin-bottom:5px}
.legend-item:last-child{margin-bottom:0}
.legend-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}

/* Floating info card */
#info-card{
  position:fixed;bottom:24px;left:24px;z-index:20;
  width:320px;max-height:420px;overflow-y:auto;
  background:var(--sidebar-bg);border:1px solid var(--sidebar-border);
  border-radius:12px;padding:18px;
  box-shadow:0 4px 24px rgba(0,0,0,0.18);
  display:none;
}
#info-card-close{
  position:absolute;top:12px;right:12px;
  background:none;border:none;cursor:pointer;
  color:var(--text-secondary);font-size:18px;line-height:1;
  padding:2px 6px;border-radius:4px;
}
#info-card-close:hover{color:var(--text-primary);background:var(--card-bg)}
#info-card h2{font-size:17px;font-weight:700;margin-bottom:6px;padding-right:28px}
.forest-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px;color:#fff}
.score-bar-wrap{background:var(--card-bg);border-radius:6px;height:10px;overflow:hidden;margin-bottom:10px}
.score-bar{height:100%;border-radius:6px;transition:width 0.5s}
.card-section{border-top:1px solid var(--sidebar-border);padding-top:10px;margin-top:10px}
.card-section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);margin-bottom:8px}
.card-section p{font-size:13px;line-height:1.5;color:var(--text-primary)}
.species-chip{display:inline-block;margin:2px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600}
.chip-cr{background:#fde8e8;color:#c0392b}
.chip-en{background:#fef3e2;color:#d35400}
.chip-vu{background:#e8f0fe;color:#1a56db}
.source-note{font-size:11px;color:var(--text-secondary);line-height:1.4}
.card-link{
  display:block;margin-top:12px;padding:8px;text-align:center;
  background:var(--card-bg);border-radius:8px;
  color:var(--text-secondary);font-size:12px;text-decoration:none;
  border:1px solid var(--sidebar-border);
}
.card-link:hover{color:var(--text-primary)}
</style>
</head>

// ── FOREST COLOR ──────────────────────────────────────────────────
function getForestColor(pct){
  if(pct===undefined||pct===null)return'#D3D1C7';
  if(pct>=70)return'#173404';
  if(pct>=50)return'#639922';
  if(pct>=30)return'#97C459';
  if(pct>=10)return'#C0DD97';
  return'#F1EFE8';
}
function getForestLabel(pct){
  if(pct>=70)return{label:'Lush',bg:'#173404'};
  if(pct>=50)return{label:'Dense',bg:'#639922'};
  if(pct>=30)return{label:'Moderate',bg:'#97C459'};
  if(pct>=10)return{label:'Sparse',bg:'#9ab85c'};
  return{label:'Bare / arid',bg:'#aaa9a5'};
}

// ── THEME ─────────────────────────────────────────────────────────
const root=document.documentElement;
if(localStorage.getItem('theme')==='dark')root.classList.add('dark');
const themeBtn=document.getElementById('theme-toggle');
function updateThemeBtn(){themeBtn.textContent=root.classList.contains('dark')?'☀️':'🌙';}
themeBtn.addEventListener('click',()=>{
  root.classList.toggle('dark');
  localStorage.setItem('theme',root.classList.contains('dark')?'dark':'light');
  applyGlobeTheme();
  updateThemeBtn();
});
updateThemeBtn();
function makeOceanTexture(color){
  const c=document.createElement('canvas');
  c.width=2;c.height=2;
  const ctx=c.getContext('2d');
  ctx.fillStyle=color;ctx.fillRect(0,0,2,2);
  return c.toDataURL();
}

function applyGlobeTheme(){
  if(!window._globe)return;
  const dark=root.classList.contains('dark');
  const color=dark?'#0D2F6E':'#1565C0';
  window._globe.atmosphereColor(color);
  window._globe.backgroundColor('rgba(0,0,0,0)');
  window._globe.globeImageUrl(makeOceanTexture(color));
}

function makeStarfield(){
  const c=document.createElement('canvas');
  c.width=1920;c.height=1080;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
  for(let i=0;i<600;i++){
    const x=Math.random()*c.width,y=Math.random()*c.height;
    const r=Math.random()*1.4,op=(0.4+Math.random()*0.6).toFixed(2);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${op})`;ctx.fill();
  }
  for(let i=0;i<40;i++){
    const x=Math.random()*c.width,y=Math.random()*c.height;
    ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);
    ctx.fillStyle=i%2===0?'rgba(180,210,255,0.8)':'rgba(255,230,200,0.7)';
    ctx.fill();
  }
  document.body.style.backgroundImage=`url(${c.toDataURL()})`;
  document.body.style.backgroundSize='cover';
}
makeStarfield();

// ── GLOBE READY ───────────────────────────────────────────────────
globe.onGlobeReady(()=>{
  applyGlobeTheme();

  const cam=JSON.parse(localStorage.getItem('iucn_camera')||'null');
  if(cam){globe.pointOfView(cam,0)}
  else{globe.pointOfView({lat:20,lng:0,altitude:1.8},0)}

  fetch('https://unpkg.com/world-atlas@2/countries-110m.json')
    .then(r=>r.json())
    .then(world=>{
      const countries=topojson.feature(world,world.objects.countries);
      globe
        .polygonsData(countries.features)
        .polygonCapColor(feat=>getForestColor(FOREST_DATA[NUM_TO_ISO3[+feat.id]]))
        .polygonSideColor(()=>'rgba(0,0,0,0.04)')
        .polygonStrokeColor(()=>'rgba(255,255,255,0.4)')
        .polygonAltitude(0.01)
        .polygonLabel(feat=>{
          const iso3=NUM_TO_ISO3[+feat.id];
          const pct=FOREST_DATA[iso3];
          const name=feat.properties?.name||iso3||'Unknown';
          return pct!==undefined
            ?`<div style="background:rgba(0,0,0,0.78);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px"><b>${name}</b><br/>Forest cover: ${pct.toFixed(1)}%</div>`
            :`<div style="background:rgba(0,0,0,0.78);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px"><b>${name}</b><br/>No data</div>`;
        })
        .onPolygonClick((feat,event)=>{
          event.stopPropagation();
          openCard(feat,NUM_TO_ISO3[+feat.id]);
        });
    });
});

// ── INFO CARD ─────────────────────────────────────────────────────
function openCard(feat,iso3){
  const pct=FOREST_DATA[iso3];
  const name=feat.properties?.name||iso3||'Unknown country';

  const bbox=getFeatureBBox(feat);
  const speciesHere=SPECIES_DATA.filter(s=>
    s.lat>=bbox.minLat-5&&s.lat<=bbox.maxLat+5&&
    s.lng>=bbox.minLng-5&&s.lng<=bbox.maxLng+5
  ).slice(0,8);

  let html=`<h2>${name}</h2>`;
  if(pct!==undefined){
    const fl=getForestLabel(pct);
    html+=`<span class="forest-badge" style="background:${fl.bg}">${pct.toFixed(1)}% — ${fl.label}</span>`;
    html+=`<div class="score-bar-wrap"><div class="score-bar" style="width:${Math.min(pct,100)}%;background:${getForestColor(pct)}"></div></div>`;
  }else{
    html+=`<p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">No FAO FRA 2020 data available.</p>`;
  }

  if(speciesHere.length>0){
    const cr=speciesHere.filter(s=>s.status==='CR').length;
    const en=speciesHere.filter(s=>s.status==='EN').length;
    const vu=speciesHere.filter(s=>s.status==='VU').length;
    html+=`<div class="card-section"><h3>Threatened species nearby (${speciesHere.length})</h3>`;
    if(cr||en||vu)html+=`<p class="source-note" style="margin-bottom:8px">${cr} CR · ${en} EN · ${vu} VU</p>`;
    html+=`<div>`;
    speciesHere.forEach(s=>{
      const cls=s.status==='CR'?'chip-cr':s.status==='EN'?'chip-en':'chip-vu';
      html+=`<span class="species-chip ${cls}">${s.status} ${s.common}</span>`;
    });
    html+=`</div></div>`;
  }

  html+=`<div class="card-section"><p class="source-note">Source: FAO Global Forest Resources Assessment 2020 — % of total land area.</p></div>`;
  html+=`<a href="https://www.fao.org/forest-resources-assessment/en/" target="_blank" class="card-link">View FAO FRA 2020 ↗</a>`;

  document.getElementById('info-card-body').innerHTML=html;
  document.getElementById('info-card').style.display='block';

  const c=getFeatureCentroid(feat);
  globe.pointOfView({lat:c.lat,lng:c.lng,altitude:1.5},600);
}

function getFeatureBBox(feat){
  let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
  const geom=feat.geometry;
  if(!geom)return{minLat:-90,maxLat:90,minLng:-180,maxLng:180};
  function collect(arr,depth){
    if(depth===0){const[lng,lat]=arr;
      if(lat<minLat)minLat=lat;if(lat>maxLat)maxLat=lat;
      if(lng<minLng)minLng=lng;if(lng>maxLng)maxLng=lng;
    }else arr.forEach(a=>collect(a,depth-1));
  }
  const d=geom.type==='Polygon'?1:2;
  geom.coordinates.forEach(ring=>collect(ring,d));
  return{minLat,maxLat,minLng,maxLng};
}
function getFeatureCentroid(feat){
  const b=getFeatureBBox(feat);
  return{lat:(b.minLat+b.maxLat)/2,lng:(b.minLng+b.maxLng)/2};
}

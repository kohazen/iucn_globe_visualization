<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080c;--text-primary:#eaeae4;--text-secondary:#a0a098;
  --card-bg:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.1);
  --nav-bg:rgba(8,8,12,0.72);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text-primary);font-family:'Inter',system-ui,sans-serif}
#top-nav{
  position:fixed;top:0;left:0;right:0;height:48px;z-index:100;
  background:var(--nav-bg);border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;padding:0 16px;gap:16px;
}
.nav-brand{font-weight:800;font-size:15px;color:var(--text-primary);white-space:nowrap;letter-spacing:-0.3px}
.nav-links{display:flex;gap:4px;flex:1}
.nav-link{
  padding:6px 14px;border-radius:8px;text-decoration:none;
  font-size:13px;font-weight:600;color:var(--text-secondary);transition:all 0.2s;
}
.nav-link:hover{background:rgba(255,255,255,0.08);color:var(--text-primary)}
.nav-link.active{background:rgba(255,255,255,0.1);color:var(--text-primary)}

.page-wrap{
  position:fixed;top:48px;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;padding:16px 24px 16px;overflow:hidden;
}
.page-header{flex-shrink:0;margin-bottom:12px}
.page-header h1{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.page-header .subtitle{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* Filter bar */
.filter-row{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{
  display:flex;align-items:center;gap:6px;padding:6px 14px;
  border-radius:20px;border:1px solid var(--glass-border);
  background:rgba(14,14,18,0.7);color:var(--text-secondary);
  font-size:11px;font-weight:600;cursor:pointer;
  transition:all 0.25s ease;opacity:0.5;
  backdrop-filter:blur(12px);font-family:inherit;
}
.filter-btn:hover{background:rgba(30,30,38,0.85);transform:translateY(-1px)}
.filter-btn.active{opacity:1;color:var(--text-primary);border-color:rgba(255,255,255,0.2);box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.filter-btn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.filter-sep{width:1px;height:20px;background:var(--glass-border);margin:0 4px}
.count-badge{
  margin-left:auto;font-size:11px;font-weight:700;color:var(--text-secondary);
  background:var(--card-bg);border:1px solid var(--glass-border);
  border-radius:16px;padding:5px 14px;
}
.count-badge span{color:var(--text-primary)}

/* Table */
.table-wrap{
  flex:1;min-height:0;overflow:auto;
  background:var(--card-bg);border:1px solid var(--glass-border);
  border-radius:10px;backdrop-filter:blur(8px);
}
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.5px;color:var(--text-secondary);padding:10px 14px;
  border-bottom:1px solid var(--glass-border);
  position:sticky;top:0;background:rgba(8,8,12,0.97);z-index:5;
}
.data-table td{font-size:12px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.04)}
.data-table tr{transition:background 0.15s}
.data-table tr:hover td{background:rgba(255,255,255,0.03)}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.taxon-tag{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;
  background:rgba(255,255,255,0.06);color:var(--text-secondary);
}
</style>
</head>

const STATUS_COLORS={CR:'#FF5252',EN:'#FFB347',VU:'#40C8F4'};
const TAXON_NAMES={MAMMALIA:'Mammalia',AVES:'Aves',REPTILIA:'Reptilia',AMPHIBIA:'Amphibia',CHONDRICHTHYES:'Chondrichthyes'};
const priority=['CR','EN','VU'];
let activeStatuses=new Set(['CR','EN','VU']);
let activeTaxons=new Set(['MAMMALIA','AVES','REPTILIA','AMPHIBIA','CHONDRICHTHYES']);

function toggleStatus(btn){
  const s=btn.dataset.status;
  if(activeStatuses.has(s))activeStatuses.delete(s); else activeStatuses.add(s);
  btn.classList.toggle('active');
  renderTable();
}
function toggleTaxon(btn){
  const t=btn.dataset.taxon;
  if(activeTaxons.has(t))activeTaxons.delete(t); else activeTaxons.add(t);
  btn.classList.toggle('active');
  renderTable();
}

function renderTable(){
  const filtered=SPECIES_DATA
    .filter(s=>activeStatuses.has(s.status)&&activeTaxons.has(s.taxon))
    .sort((a,b)=>priority.indexOf(a.status)-priority.indexOf(b.status));
  
  document.getElementById('count-num').textContent=filtered.length;
  document.getElementById('count-label').textContent=
    filtered.length===SPECIES_DATA.length?'species':`of ${SPECIES_DATA.length} species`;

  const tbody=document.getElementById('table-body');
  tbody.innerHTML=filtered.map((s,i)=>`<tr>
    <td style="color:var(--text-secondary)">${i+1}</td>
    <td><strong>${s.common}</strong></td>
    <td style="font-style:italic;color:var(--text-secondary)">${s.name}</td>
    <td><span class="status-dot" style="background:${STATUS_COLORS[s.status]}"></span>${s.status}</td>
    <td><span class="taxon-tag">${TAXON_NAMES[s.taxon]||s.taxon}</span></td>
    <td>${s.lat.toFixed(1)}°, ${s.lng.toFixed(1)}°</td>
  </tr>`).join('');
}
renderTable();
</script>
